name: Verify

# Types, checks, build. Nothing else.
#
# Deliberately does NOT run the ingestion, the analysis or the recorder. Those
# reach thirty-seven live feeds, spend a model's daily allowance and synthesise
# five minutes of audio respectively — they belong to the press run, which
# happens once a day for a reason. A verification job that did them would cost
# the day's quota on every push and rewrite the edition under the very build it
# was meant to be checking.
on:
  push:
    branches: [main]
  pull_request:

# A second push while the first is still verifying makes the first answer
# stale, so it is cancelled rather than raced.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matched to the press run. Node 24 strips TypeScript natively, which
          # is what lets both the services and the check suites run unbuilt.
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # `tsc` cannot check this app on a fresh checkout without this.
      #
      # The routes are typed with Next's own generated helpers — LayoutProps<"/">,
      # PageProps<"/story/[id]"> — and those live in .next/types, which only
      # exists after a build or a dev server has run. Locally there is always
      # one lying around, so `npx tsc --noEmit` passes on a developer's machine
      # and fails on the first CI run, which is precisely what happened here.
      # `typegen` writes the definitions without doing the whole build.
      - name: Generate route types
        run: npx next typegen

      - name: Types
        run: npx tsc --noEmit

      # The eleven numeric suites in checks/. They read the committed edition
      # and the committed recording, so they need nothing from the network.
      - name: Checks
        run: npm run check

      - name: Build
        run: npm run build
